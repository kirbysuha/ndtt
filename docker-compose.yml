services:
  db:
    image: postgres:16-alpine
    container_name: ndtt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ndtt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ndtt_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ndtt_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ndtt_user} -d ${POSTGRES_DB:-ndtt_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndtt_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ndtt_user}:${POSTGRES_PASSWORD:-ndtt_pass}@db:5432/${POSTGRES_DB:-ndtt_db}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-ndtt_user}:${POSTGRES_PASSWORD:-ndtt_pass}@db:5432/${POSTGRES_DB:-ndtt_db}
      DEBUG: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-strong-secret}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ndtt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:

